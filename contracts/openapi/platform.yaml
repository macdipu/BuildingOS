          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (not a support user, or not the session owner)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "SUPPORT_SESSION_NOT_FOUND (also for another agent's sessions)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "SESSION_ENDED, APPROVAL_ALREADY_PENDING or APPROVAL_ALREADY_GRANTED"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/platform/backoffice/support-sessions/{sessionId}/scope-check:
    get:
      summary: "Whether the session may use a scope now"
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: scope
          in: query
          required: true
          schema: { type: string, enum: [SUPPORT_VIEW_MEMBERS, SUPPORT_VIEW_UNITS, SUPPORT_VIEW_OWNERSHIP_HISTORY, SUPPORT_EDIT_UNIT, SUPPORT_MANAGE_MEMBERSHIP_INVITE, SUPPORT_REVOKE_MEMBERSHIP, SUPPORT_VIEW_SUBSCRIPTION, SUPPORT_VIEW_PAYMENTS, SUPPORT_REVERSE_PAYMENT, SUPPORT_TRANSFER_OWNERSHIP, SUPPORT_REMOVE_BUILDING_ADMIN, SUPPORT_EXPORT_FINANCIAL_UNRESTRICTED] }
      responses:
        "200":
          description: "Success envelope (data: SupportScopeCheck)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (scope missing or unknown)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (caller is neither SUPER_ADMIN/PLATFORM_ADMIN nor SUPPORT_AGENT)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "SUPPORT_SESSION_NOT_FOUND (also for another agent's sessions)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/platform/backoffice/elevated-approvals:
    get:
      summary: "List elevated approval requests (admins: all; SUPPORT_AGENT: on own sessions only)"
      description: >
        meta carries page, size, total. Newest requested first.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, DENIED] }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: "Success envelope (data: ElevatedApprovalRequest[])"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (unknown status, page < 0, size outside 1-100)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (caller is neither SUPER_ADMIN/PLATFORM_ADMIN nor SUPPORT_AGENT)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/platform/backoffice/elevated-approvals/{approvalId}/approve:
    post:
      summary: "SUPER_ADMIN other than the session owner (four-eyes): approve a PENDING request on an active session"
      description: >
        Appends a lifecycle_transition row with the approver. The approval ends with its session.
      security:
        - bearerAuth: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReasonRequest" }
      responses:
        "200":
          description: "Success envelope (data: ElevatedApprovalRequest)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (reason longer than 1000)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (not SUPER_ADMIN, or the session owner)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "ELEVATED_APPROVAL_NOT_FOUND"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "SESSION_ENDED or APPROVAL_NOT_PENDING"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/platform/backoffice/elevated-approvals/{approvalId}/deny:
    post:
      summary: "SUPER_ADMIN other than the session owner (four-eyes): deny a PENDING request with a reason"
      description: >
        Appends a lifecycle_transition row with the approver and reason.
      security:
        - bearerAuth: []
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportReasonRequest" }
      responses:
        "200":
          description: "Success envelope (data: ElevatedApprovalRequest)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (reason missing or longer than 1000)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (not SUPER_ADMIN, or the session owner)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "ELEVATED_APPROVAL_NOT_FOUND"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "SESSION_ENDED or APPROVAL_NOT_PENDING"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/platform/backoffice/system-health:
    get:
      summary: "SUPER_ADMIN: readiness of every BuildingOS backend service in one call (BOC-08)"
      description: >
        Aggregates each configured service's /actuator/health/readiness (buildingos.health.services) plus
        back-office-service's own. Readiness bodies are never forwarded: only status, HTTP code and latency.
        An unreachable or timed-out service is UNKNOWN; the endpoint still answers 200. overall is UP when every
        service is UP, DOWN when none is, otherwise DEGRADED.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success envelope (data: SystemHealth)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (caller is not SUPER_ADMIN)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /internal/users/provision:
    post:
      summary: "auth-service: find or create a user by phone (service-to-service, D-29)"
      description: >
        Called by building-service with the approver's relayed token. Never routed by the gateway. Grants no roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionUserRequest" }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (not a Bangladesh mobile number)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (relayed token lacks SUPER_ADMIN/PLATFORM_ADMIN)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /internal/audit:
    get:
      summary: "auth-, building- and subscription-service: audit rows (service-to-service, F6-T5b/F6-T5c, D-37)"
      description: >
        Common internal audit read contract, served identically by auth-service, building-service and
        subscription-service. Called by back-office-service with the caller's relayed token; never routed by the
        gateway. SUPER_ADMIN only. Newest first (occurredAt, then id); since inclusive, until exclusive; entityType
        and actorUserId filter exactly. before/after payloads are never returned.
        auth-service: platform-role grant/revoke rows (entityType PLATFORM_ROLE, entityId = target user); any other
        entityType returns an empty list.
        building-service: lifecycle_transition rows (entityType BUILDING_APPLICATION | BUILDING, action
        "FROM<U+2192>TO" with FROM = NONE on creation, buildingId set only for BUILDING) merged with building_audit rows
        (buildingId always set), truncated to limit after the merge.
        subscription-service: audit_event rows (entityId is the string key, e.g. a plan code); buildingId and reason
        are null.
      security:
        - bearerAuth: []
      parameters:
        - { name: since, in: query, required: false, schema: { type: string, format: date-time }, description: "Inclusive lower bound (ISO-8601 instant)" }
        - { name: until, in: query, required: false, schema: { type: string, format: date-time }, description: "Exclusive upper bound (ISO-8601 instant)" }
        - { name: entityType, in: query, required: false, schema: { type: string, example: PLATFORM_ROLE } }
        - { name: actorUserId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: "Success envelope; data is an array of InternalAuditEvent"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ApiEnvelope" }
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/InternalAuditEvent" }
        "400":
          description: "INVALID_REQUEST (limit outside 1-200, malformed since/until/actorUserId)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (relayed token lacks SUPER_ADMIN)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /internal/platform/info:
    get:
      summary: Service metadata (direct, auth-service or building-service)
      description: >
        Same route and behavior on both services; distinguished by which service instance answers.
        Not exposed publicly outside the gateway in a deployed environment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metadata envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeMetadata" }
        "401":
          description: Missing/expired/wrong-audience/wrong-issuer/bad-signature token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      required: [success, data, traceId]
      properties:
        success: { type: boolean }
        data: {}
        meta: { type: object }
        traceId: { type: string }
    InternalAuditEvent:
      type: object
      description: "Common internal audit read item (F6-T5b, F6-T5c); no before/after payloads."
      required: [id, source, occurredAt, action, entityType, entityId]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [auth-service, building-service, subscription-service], example: auth-service }
        occurredAt: { type: string, format: date-time }
        actorUserId: { type: string, format: uuid, nullable: true, description: "null = system" }
        action: { type: string, example: PLATFORM_ROLE_GRANTED, description: "auth-service: PLATFORM_ROLE_GRANTED | PLATFORM_ROLE_REVOKED; building-service: FROM<U+2192>TO for lifecycle transitions, else the building_audit action; subscription-service: the audit_event action" }
        entityType: { type: string, example: PLATFORM_ROLE }
        entityId: { type: string }
        buildingId: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        role: { type: string, description: "auth-service only (absent elsewhere): the platform role granted/revoked" }
    ApiEnvelopeMetadata:
      type: object
      required: [success, data, meta, traceId]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [service]
          properties:
            service: { type: string, example: auth-service }
        meta: { type: object }
        traceId: { type: string, format: uuid }
    BuildingApplicationRequest:
      type: object
      properties:
        buildingName: { type: string, maxLength: 200 }
        buildingType: { type: string, enum: [RESIDENTIAL, COMMERCIAL, MIXED] }
        address: { type: string, maxLength: 500 }
        area: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        postalCode: { type: string, maxLength: 16 }
        totalFloors: { type: integer, minimum: 1 }
        estimatedUnits: { type: integer, minimum: 1 }
        applicantRelationship: { type: string, enum: [OWNER, COMMITTEE_MEMBER, PROPERTY_MANAGER, DEVELOPER, OTHER] }
        relationshipNote: { type: string, maxLength: 200, description: Required at submit when applicantRelationship is OTHER }
        contactName: { type: string, maxLength: 200 }
        contactPhone: { type: string, description: "01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX; stored as 01XXXXXXXXX" }
        contactEmail: { type: string, format: email }
        managementType: { type: string, enum: [SELF_MANAGED, OWNERS_COMMITTEE, MANAGEMENT_COMPANY, DEVELOPER_MANAGED] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    DocumentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    DocumentBytes:
      type: string
      format: binary
    MessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 1000 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 1000 }
    ApproveRequest:
      type: object
      required: [adminPhone, reason]
      properties:
        adminPhone: { type: string, description: Initial BUILDING_ADMIN; review UI pre-fills the applicant contact phone }
        reason: { type: string, maxLength: 1000 }
    NoteRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 2000 }
    ProvisionUserRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
    ClaimInvitationRequest:
      type: object
      required: [operationId]
      properties:
        operationId: { type: string, format: uuid, description: Idempotency key; a replay returns the prior result }
    InviteOwnerRequest:
      type: object
      required: [phone, role]
      properties:
        phone: { type: string, description: "01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX" }
        role: { type: string, enum: [OWNER] }
        reason: { type: string, maxLength: 1000, description: Required for platform admins without a building-admin membership }
    RevokeMembershipRequest:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64 }
    FloorRequest:
      type: object
      required: [label, kind, displayOrder]
      properties:
        label: { type: string, maxLength: 40 }
        kind: { type: string, enum: [BASEMENT, GROUND, REGULAR, ROOF, COMMON] }
        displayOrder: { type: integer }
        expectedVersion: { type: integer, format: int64, description: Required on update }
        reason: { type: string, maxLength: 1000 }
    UnitRequest:
      type: object
      required: [number, floorId, type, areaSqft]
      properties:
        number: { type: string, maxLength: 32, description: Trimmed; unique per building ignoring case, display spelling kept }
        floorId: { type: string, format: uuid }
        type: { type: string, enum: [FLAT, PARKING, STORAGE, COMMERCIAL, COMMON, OTHER] }
        areaSqft: { type: number, exclusiveMinimum: true, minimum: 0, description: Square feet, at most 2 decimals }
        bedrooms: { type: integer, minimum: 0 }
        defaultMaintenanceRate: { type: number, minimum: 0, description: At most 2 decimals }
        notes: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64, description: Required on update }
        reason: { type: string, maxLength: 1000 }
    BatchRow:
      type: object
      properties:
        number: { type: string }
        floorId: { type: string, format: uuid }
        floorLabel: { type: string }
        type: { type: string, enum: [FLAT, PARKING, STORAGE, COMMERCIAL, COMMON, OTHER] }
        areaSqft: { type: number }
        bedrooms: { type: integer }
        defaultMaintenanceRate: { type: number }
        notes: { type: string }
    BatchPreviewRequest:
      type: object
      description: Either explicit rows or a floor pattern
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/BatchRow" }
        generate:
          type: object
          properties:
            floorIds: { type: array, items: { type: string, format: uuid } }
            unitsPerFloor: { type: integer, minimum: 1 }
            numberPattern: { type: string, example: "{floor}{letter}" }
            start: { type: integer }
            type: { type: string, enum: [FLAT, PARKING, STORAGE, COMMERCIAL, COMMON, OTHER] }
            areaSqft: { type: number }
            bedrooms: { type: integer }
            defaultMaintenanceRate: { type: number }
            templateFloorId: { type: string, format: uuid, description: Copy this floor's units instead of a pattern }
    SheetUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: CSV or XLSX (no macros/formulas), bounded rows and bytes }
    BatchCommitRequest:
      type: object
      required: [rows, operationId]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/BatchRow" }
        operationId: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000 }
    AssignOwnershipRequest:
      type: object
      required: [ownerUserId, share, effectiveDate, expectedVersion, operationId]
      properties:
        ownerUserId: { type: string, format: uuid, description: Must hold an active OWNER membership }
        share: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, description: Percentage, at most 4 decimals }
        effectiveDate: { type: string, format: date, description: Must be today in Asia/Dhaka }
        notes: { type: string, maxLength: 1000 }
        reason: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64, description: Unit ownership revision }
        operationId: { type: string, format: uuid }
    TransferOwnershipRequest:
      type: object
      required: [sourceOwnerUserId, recipientUserId, share, effectiveDate, reason, expectedVersion, operationId]
      properties:
        sourceOwnerUserId: { type: string, format: uuid }
        recipientUserId: { type: string, format: uuid, description: Must hold an active OWNER membership }
        share: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, description: Percentage points moved, at most 4 decimals }
        effectiveDate: { type: string, format: date, description: Must be today in Asia/Dhaka }
        reference: { type: string, maxLength: 200 }
        reason: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64 }
        operationId: { type: string, format: uuid }
    TransferDocumentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        reason: { type: string, maxLength: 1000 }
    StartOnboardingSessionRequest:
      type: object
      required: [buildingId, assignedAgentUserId, accessScope, reason, expiresAt]
      properties:
        buildingId: { type: string, format: uuid, description: Must exist in building-service }
        assignedAgentUserId: { type: string, format: uuid, description: Must currently hold ONBOARDING_AGENT }
        accessScope:
          type: array
          minItems: 1
          uniqueItems: true
          description: D-10 onboarding scopes
          items: { type: string, enum: [ONBOARDING_VIEW_BUILDING, ONBOARDING_EDIT_BUILDING_INFO, ONBOARDING_MANAGE_FLOORS_UNITS, ONBOARDING_MANAGE_COMMITTEE_STAFF, ONBOARDING_CONFIGURE_MAINTENANCE, ONBOARDING_CONFIGURE_RENT_MANAGEMENT, ONBOARDING_CONFIGURE_PAYMENT_METHODS, ONBOARDING_SEND_INVITATIONS, ONBOARDING_ACTIVATE_BUILDING] }
        reason: { type: string, maxLength: 1000 }
        notes: { type: string, maxLength: 2000 }
        expiresAt: { type: string, format: date-time, description: "In the future and at most buildingos.onboarding.max-duration (default P30D) after start" }
    OnboardingTransitionRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000, description: Optional audit reason recorded on the transition }
    OnboardingSession:
      type: object
      required: [id, buildingId, assignedAgentUserId, status, accessScope, reason, startedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        assignedAgentUserId: { type: string, format: uuid }
        requestedByUserId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [REQUESTED, ASSIGNED, IN_PROGRESS, WAITING_FOR_CUSTOMER, COMPLETED, CANCELLED, EXPIRED] }
        accessScope:
          type: array
          items: { type: string, enum: [ONBOARDING_VIEW_BUILDING, ONBOARDING_EDIT_BUILDING_INFO, ONBOARDING_MANAGE_FLOORS_UNITS, ONBOARDING_MANAGE_COMMITTEE_STAFF, ONBOARDING_CONFIGURE_MAINTENANCE, ONBOARDING_CONFIGURE_RENT_MANAGEMENT, ONBOARDING_CONFIGURE_PAYMENT_METHODS, ONBOARDING_SEND_INVITATIONS, ONBOARDING_ACTIVATE_BUILDING] }
        reason: { type: string }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        notes: { type: string, nullable: true }
    StartSupportSessionRequest:
      type: object
      required: [permissionScope, reason, expiresAt]
      description: At least one of targetUserId and buildingId.
      properties:
        targetUserId: { type: string, format: uuid, nullable: true, description: Must exist in auth-service }
        buildingId: { type: string, format: uuid, nullable: true, description: Must exist in building-service }
        permissionScope:
          type: array
          minItems: 1
          uniqueItems: true
          description: D-10 support scopes; high-risk ones become PENDING elevated approval requests
          items: { type: string, enum: [SUPPORT_VIEW_MEMBERS, SUPPORT_VIEW_UNITS, SUPPORT_VIEW_OWNERSHIP_HISTORY, SUPPORT_EDIT_UNIT, SUPPORT_MANAGE_MEMBERSHIP_INVITE, SUPPORT_REVOKE_MEMBERSHIP, SUPPORT_VIEW_SUBSCRIPTION, SUPPORT_VIEW_PAYMENTS, SUPPORT_REVERSE_PAYMENT, SUPPORT_TRANSFER_OWNERSHIP, SUPPORT_REMOVE_BUILDING_ADMIN, SUPPORT_EXPORT_FINANCIAL_UNRESTRICTED] }
        reason: { type: string, maxLength: 1000 }
        expiresAt: { type: string, format: date-time, description: "In the future and at most buildingos.support.max-duration (default PT8H) after start" }
    SystemHealth:
      type: object
      required: [checkedAt, overall, services]
      properties:
        checkedAt: { type: string, format: date-time }
        overall: { type: string, enum: [UP, DEGRADED, DOWN] }
        services:
          type: array
          items: { $ref: "#/components/schemas/ServiceReadiness" }
    ServiceReadiness:
      type: object
      required: [name, status, latencyMs]
      properties:
        name: { type: string, example: auth-service }
        status: { type: string, enum: [UP, DOWN, UNKNOWN] }
        httpStatus: { type: integer, description: "Readiness HTTP status; absent when the service was unreachable or timed out" }
        latencyMs: { type: integer, format: int64, minimum: 0 }
    SupportReasonRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1000, description: Audit reason; required to deny, optional otherwise }
    RequestElevatedApprovalRequest:
      type: object
      required: [scope, reason]
      properties:
        scope: { type: string, enum: [SUPPORT_REVERSE_PAYMENT, SUPPORT_TRANSFER_OWNERSHIP, SUPPORT_REMOVE_BUILDING_ADMIN, SUPPORT_EXPORT_FINANCIAL_UNRESTRICTED] }
        reason: { type: string, maxLength: 1000 }
    SupportSession:
      type: object
      required: [id, platformUserId, status, reason, permissionScope, startedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        platformUserId: { type: string, format: uuid }
        targetUserId: { type: string, format: uuid, nullable: true }
        buildingId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [ACTIVE, ENDED, EXPIRED] }
        reason: { type: string }
        permissionScope:
          type: array
          description: Every scope named on the session; high-risk entries are usable only while an APPROVED request exists
          items: { type: string, enum: [SUPPORT_VIEW_MEMBERS, SUPPORT_VIEW_UNITS, SUPPORT_VIEW_OWNERSHIP_HISTORY, SUPPORT_EDIT_UNIT, SUPPORT_MANAGE_MEMBERSHIP_INVITE, SUPPORT_REVOKE_MEMBERSHIP, SUPPORT_VIEW_SUBSCRIPTION, SUPPORT_VIEW_PAYMENTS, SUPPORT_REVERSE_PAYMENT, SUPPORT_TRANSFER_OWNERSHIP, SUPPORT_REMOVE_BUILDING_ADMIN, SUPPORT_EXPORT_FINANCIAL_UNRESTRICTED] }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true, description: "Equals expiresAt when EXPIRED" }
    SupportSessionDetail:
      allOf:
        - $ref: "#/components/schemas/SupportSession"
        - type: object
          required: [elevatedApprovals]
          properties:
            elevatedApprovals:
              type: array
              items: { $ref: "#/components/schemas/ElevatedApprovalRequest" }
    ElevatedApprovalRequest:
      type: object
      required: [id, supportSessionId, requestedScope, status, requestedAt]
      properties:
        id: { type: string, format: uuid }
        supportSessionId: { type: string, format: uuid }
        requestedScope: { type: string, enum: [SUPPORT_REVERSE_PAYMENT, SUPPORT_TRANSFER_OWNERSHIP, SUPPORT_REMOVE_BUILDING_ADMIN, SUPPORT_EXPORT_FINANCIAL_UNRESTRICTED] }
        status: { type: string, enum: [PENDING, APPROVED, DENIED] }
        decidedBy: { type: string, format: uuid, nullable: true }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time, nullable: true }
        decisionReason: { type: string, nullable: true }
    SupportScopeCheck:
      type: object
      required: [sessionId, scope, result]
      properties:
        sessionId: { type: string, format: uuid }
        scope: { type: string, enum: [SUPPORT_VIEW_MEMBERS, SUPPORT_VIEW_UNITS, SUPPORT_VIEW_OWNERSHIP_HISTORY, SUPPORT_EDIT_UNIT, SUPPORT_MANAGE_MEMBERSHIP_INVITE, SUPPORT_REVOKE_MEMBERSHIP, SUPPORT_VIEW_SUBSCRIPTION, SUPPORT_VIEW_PAYMENTS, SUPPORT_REVERSE_PAYMENT, SUPPORT_TRANSFER_OWNERSHIP, SUPPORT_REMOVE_BUILDING_ADMIN, SUPPORT_EXPORT_FINANCIAL_UNRESTRICTED] }
        result: { type: string, enum: [ALLOWED, PENDING_APPROVAL, NOT_GRANTED, SESSION_ENDED] }
    ApiError:
      type: object
      required: [success, code, message, traceId]
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          description: Stable error code; each operation lists the codes it may return.
          example: ACCESS_DENIED
        message: { type: string }
        traceId: { type: string, format: uuid }
