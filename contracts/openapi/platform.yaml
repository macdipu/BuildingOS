              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (member without OWNER or admin role)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "BUILDING_NOT_FOUND or UNIT_NOT_FOUND (also for units an owner never owned)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/buildings/{buildingId}/units/{unitId}/ownership-transfers/{transferId}/documents:
    get:
      summary: "Transfer document metadata (admins, or the transfer's source/recipient with a current OWNER membership)"
      security:
        - bearerAuth: []
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "BUILDING_NOT_FOUND or TRANSFER_NOT_FOUND (also for non-parties, revoked parties and a wrong unit)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      summary: "Attach a transfer document (admins); PDF, JPEG or PNG detected from content"
      security:
        - bearerAuth: []
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/TransferDocumentUpload" }
      responses:
        "201":
          description: "Created envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (reason required for platform admins without a building-admin membership)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (requires BUILDING_ADMIN membership or platform admin)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "BUILDING_NOT_FOUND or TRANSFER_NOT_FOUND"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "BUILDING_READ_ONLY or DOCUMENT_LIMIT_REACHED"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "413":
          description: "DOCUMENT_TOO_LARGE"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "415":
          description: "UNSUPPORTED_DOCUMENT_TYPE"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: "DEPENDENCY_UNAVAILABLE (object storage; no metadata is kept)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/buildings/{buildingId}/units/{unitId}/ownership-transfers/{transferId}/documents/{documentId}:
    get:
      summary: "Download a transfer document (attachment, nosniff)"
      security:
        - bearerAuth: []
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Document bytes, Content-Disposition attachment"
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/DocumentBytes" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "BUILDING_NOT_FOUND or TRANSFER_NOT_FOUND (also for non-parties, revoked parties and a wrong unit), or DOCUMENT_NOT_FOUND"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "503":
          description: "DEPENDENCY_UNAVAILABLE"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    delete:
      summary: "Audited removal (admins); the transfer itself is kept"
      security:
        - bearerAuth: []
      parameters:
        - name: buildingId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: unitId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: transferId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequest" }
      responses:
        "204":
          description: "Removed"
        "400":
          description: "INVALID_REQUEST (reason required)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (requires BUILDING_ADMIN membership or platform admin)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "BUILDING_NOT_FOUND, TRANSFER_NOT_FOUND or DOCUMENT_NOT_FOUND"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "BUILDING_READ_ONLY"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /internal/users/provision:
    post:
      summary: "auth-service: find or create a user by phone (service-to-service, D-29)"
      description: >
        Called by building-service with the approver's relayed token. Never routed by the gateway. Grants no roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionUserRequest" }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST (not a Bangladesh mobile number)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "403":
          description: "ACCESS_DENIED (relayed token lacks SUPER_ADMIN/PLATFORM_ADMIN)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /internal/platform/info:
    get:
      summary: Service metadata (direct, auth-service or building-service)
      description: >
        Same route and behavior on both services; distinguished by which service instance answers.
        Not exposed publicly outside the gateway in a deployed environment.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Metadata envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeMetadata" }
        "401":
          description: Missing/expired/wrong-audience/wrong-issuer/bad-signature token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      required: [success, data, traceId]
      properties:
        success: { type: boolean }
        data: {}
        meta: { type: object }
        traceId: { type: string }
    ApiEnvelopeMetadata:
      type: object
      required: [success, data, meta, traceId]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [service]
          properties:
            service: { type: string, example: auth-service }
        meta: { type: object }
        traceId: { type: string, format: uuid }
    BuildingApplicationRequest:
      type: object
      properties:
        buildingName: { type: string, maxLength: 200 }
        buildingType: { type: string, enum: [RESIDENTIAL, COMMERCIAL, MIXED] }
        address: { type: string, maxLength: 500 }
        area: { type: string, maxLength: 120 }
        district: { type: string, maxLength: 120 }
        postalCode: { type: string, maxLength: 16 }
        totalFloors: { type: integer, minimum: 1 }
        estimatedUnits: { type: integer, minimum: 1 }
        applicantRelationship: { type: string, enum: [OWNER, COMMITTEE_MEMBER, PROPERTY_MANAGER, DEVELOPER, OTHER] }
        relationshipNote: { type: string, maxLength: 200, description: Required at submit when applicantRelationship is OTHER }
        contactName: { type: string, maxLength: 200 }
        contactPhone: { type: string, description: "01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX; stored as 01XXXXXXXXX" }
        contactEmail: { type: string, format: email }
        managementType: { type: string, enum: [SELF_MANAGED, OWNERS_COMMITTEE, MANAGEMENT_COMPANY, DEVELOPER_MANAGED] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    DocumentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    DocumentBytes:
      type: string
      format: binary
    MessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 1000 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, maxLength: 1000 }
    ApproveRequest:
      type: object
      required: [adminPhone, reason]
      properties:
        adminPhone: { type: string, description: Initial BUILDING_ADMIN; review UI pre-fills the applicant contact phone }
        reason: { type: string, maxLength: 1000 }
    NoteRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 2000 }
    ProvisionUserRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string }
    ClaimInvitationRequest:
      type: object
      required: [operationId]
      properties:
        operationId: { type: string, format: uuid, description: Idempotency key; a replay returns the prior result }
    InviteOwnerRequest:
      type: object
      required: [phone, role]
      properties:
        phone: { type: string, description: "01XXXXXXXXX, 8801XXXXXXXXX or +8801XXXXXXXXX" }
        role: { type: string, enum: [OWNER] }
        reason: { type: string, maxLength: 1000, description: Required for platform admins without a building-admin membership }
    RevokeMembershipRequest:
      type: object
      required: [reason, expectedVersion]
      properties:
        reason: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64 }
    FloorRequest:
      type: object
      required: [label, kind, displayOrder]
      properties:
        label: { type: string, maxLength: 40 }
        kind: { type: string, enum: [BASEMENT, GROUND, REGULAR, ROOF, COMMON] }
        displayOrder: { type: integer }
        expectedVersion: { type: integer, format: int64, description: Required on update }
        reason: { type: string, maxLength: 1000 }
    UnitRequest:
      type: object
      required: [number, floorId, type, areaSqft]
      properties:
        number: { type: string, maxLength: 32, description: Trimmed; unique per building ignoring case, display spelling kept }
        floorId: { type: string, format: uuid }
        type: { type: string, enum: [FLAT, PARKING, STORAGE, COMMERCIAL, COMMON, OTHER] }
        areaSqft: { type: number, exclusiveMinimum: true, minimum: 0, description: Square feet, at most 2 decimals }
        bedrooms: { type: integer, minimum: 0 }
        defaultMaintenanceRate: { type: number, minimum: 0, description: At most 2 decimals }
        notes: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64, description: Required on update }
        reason: { type: string, maxLength: 1000 }
    BatchRow:
      type: object
      properties:
        number: { type: string }
        floorId: { type: string, format: uuid }
        floorLabel: { type: string }
        type: { type: string, enum: [FLAT, PARKING, STORAGE, COMMERCIAL, COMMON, OTHER] }
        areaSqft: { type: number }
        bedrooms: { type: integer }
        defaultMaintenanceRate: { type: number }
        notes: { type: string }
    BatchPreviewRequest:
      type: object
      description: Either explicit rows or a floor pattern
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/BatchRow" }
        generate:
          type: object
          properties:
            floorIds: { type: array, items: { type: string, format: uuid } }
            unitsPerFloor: { type: integer, minimum: 1 }
            numberPattern: { type: string, example: "{floor}{letter}" }
            start: { type: integer }
            type: { type: string, enum: [FLAT, PARKING, STORAGE, COMMERCIAL, COMMON, OTHER] }
            areaSqft: { type: number }
            bedrooms: { type: integer }
            defaultMaintenanceRate: { type: number }
            templateFloorId: { type: string, format: uuid, description: Copy this floor's units instead of a pattern }
    SheetUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary, description: CSV or XLSX (no macros/formulas), bounded rows and bytes }
    BatchCommitRequest:
      type: object
      required: [rows, operationId]
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/BatchRow" }
        operationId: { type: string, format: uuid }
        reason: { type: string, maxLength: 1000 }
    AssignOwnershipRequest:
      type: object
      required: [ownerUserId, share, effectiveDate, expectedVersion, operationId]
      properties:
        ownerUserId: { type: string, format: uuid, description: Must hold an active OWNER membership }
        share: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, description: Percentage, at most 4 decimals }
        effectiveDate: { type: string, format: date, description: Must be today in Asia/Dhaka }
        notes: { type: string, maxLength: 1000 }
        reason: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64, description: Unit ownership revision }
        operationId: { type: string, format: uuid }
    TransferOwnershipRequest:
      type: object
      required: [sourceOwnerUserId, recipientUserId, share, effectiveDate, reason, expectedVersion, operationId]
      properties:
        sourceOwnerUserId: { type: string, format: uuid }
        recipientUserId: { type: string, format: uuid, description: Must hold an active OWNER membership }
        share: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100, description: Percentage points moved, at most 4 decimals }
        effectiveDate: { type: string, format: date, description: Must be today in Asia/Dhaka }
        reference: { type: string, maxLength: 200 }
        reason: { type: string, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64 }
        operationId: { type: string, format: uuid }
    TransferDocumentUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        reason: { type: string, maxLength: 1000 }
    ApiError:
      type: object
      required: [success, code, message, traceId]
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          description: Stable error code; each operation lists the codes it may return.
          example: ACCESS_DENIED
        message: { type: string }
        traceId: { type: string, format: uuid }
