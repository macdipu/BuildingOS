          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/me/entitlements:
    get:
      summary: "Caller's effective entitlements: free tier plus own plan"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/building-applications:
    post:
      summary: "Start a draft building application (any authenticated user)"
      description: >
        All fields optional while drafting. BOS-010 F2 AP-01/AP-02; building-service.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildingApplicationRequest" }
      responses:
        "201":
          description: "Created envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/me/building-applications:
    get:
      summary: "Caller's own applications, newest first"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/building-applications/{applicationId}:
    get:
      summary: "Application detail (applicant or platform admin)"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "APPLICATION_NOT_FOUND (also for applications the caller does not own)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    put:
      summary: "Replace draft fields (applicant, DRAFT or MORE_INFORMATION_REQUIRED)"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildingApplicationRequest" }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "APPLICATION_NOT_FOUND (also for applications the caller does not own)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "NOT_EDITABLE"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/building-applications/{applicationId}/submit:
    post:
      summary: "Submit (DRAFT/MORE_INFORMATION_REQUIRED to SUBMITTED)"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "400":
          description: "INVALID_REQUEST or APPLICATION_INCOMPLETE (message lists missing fields)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "APPLICATION_NOT_FOUND (also for applications the caller does not own)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "409":
          description: "INVALID_TRANSITION"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/building-applications/{applicationId}/history:
    get:
      summary: "Audited status transitions (no internal notes)"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "APPLICATION_NOT_FOUND (also for applications the caller does not own)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /api/v1/building-applications/{applicationId}/documents:
    get:
      summary: "Verification document metadata"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "Success envelope"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelope" }
        "401":
          description: "Missing or invalid token"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "404":
          description: "APPLICATION_NOT_FOUND (also for applications the caller does not own)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      summary: "Upload a verification document (applicant, while editable)"
      description: >
        Stored in S3-compatible storage (D-28). Type detected from bytes; file name is display metadata only.
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
