server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
platform:
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
spring:
  application:
    name: back-office-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
buildingos:
  services:
    auth-url: ${AUTH_SERVICE_URL}
    building-url: ${BUILDING_SERVICE_URL}
    subscription-url: ${SUBSCRIPTION_SERVICE_URL}
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${SERVICE_READ_TIMEOUT:PT5S}
  onboarding:
    max-duration: ${ONBOARDING_MAX_DURATION:P30D}
  support:
    max-duration: ${SUPPORT_MAX_DURATION:PT8H}
  audit:
    # F6-T5d audit fan-out: per-source timeout; a slower source is listed in unavailableSources.
    timeout: ${AUDIT_SOURCE_TIMEOUT:PT3S}
  health:
    # BOC-08 System Health: services whose /actuator/health/readiness is aggregated. No url = this service.
    timeout: ${HEALTH_PROBE_TIMEOUT:PT2S}
    services:
      - name: auth-service
        url: ${buildingos.services.auth-url}
      - name: building-service
        url: ${buildingos.services.building-url}
      - name: subscription-service
        url: ${buildingos.services.subscription-url}
      - name: back-office-service
