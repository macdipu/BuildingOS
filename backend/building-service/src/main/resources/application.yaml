server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
platform:
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
spring:
  application:
    name: building-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: -1
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${DOCUMENTS_MAX_SIZE_BYTES:10485760}B
      max-request-size: ${DOCUMENTS_MAX_REQUEST_BYTES:11534336}B
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:5000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:5000}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:10000}
buildingos:
  membership:
    invitation-ttl: ${MEMBERSHIP_INVITATION_TTL:P7D}
  units:
    batch:
      max-rows: ${UNIT_BATCH_MAX_ROWS:500}
      max-sheet-bytes: ${UNIT_BATCH_MAX_SHEET_BYTES:1048576}
  ownership:
    zone: ${OWNERSHIP_ZONE:Asia/Dhaka}
  outbox:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT1S}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    send-timeout: ${OUTBOX_SEND_TIMEOUT:PT15S}
    retry-base: ${OUTBOX_RETRY_BASE:PT1S}
    retry-max: ${OUTBOX_RETRY_MAX:PT5M}
    topic-partitions: ${OUTBOX_TOPIC_PARTITIONS:3}
    topic-replicas: ${OUTBOX_TOPIC_REPLICAS:1}
  documents:
    max-size-bytes: ${DOCUMENTS_MAX_SIZE_BYTES:10485760}
    max-per-application: ${DOCUMENTS_MAX_PER_APPLICATION:10}
    s3:
      endpoint: ${DOCUMENTS_S3_ENDPOINT:}
      region: ${DOCUMENTS_S3_REGION:us-east-1}
      bucket: ${DOCUMENTS_S3_BUCKET:building-documents}
      access-key: ${DOCUMENTS_S3_ACCESS_KEY:}
      secret-key: ${DOCUMENTS_S3_SECRET_KEY:}
      path-style: ${DOCUMENTS_S3_PATH_STYLE:false}
  services:
    auth-url: ${AUTH_SERVICE_URL}
    subscription-url: ${SUBSCRIPTION_SERVICE_URL}
    connect-timeout: ${SERVICE_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${SERVICE_READ_TIMEOUT:PT5S}
  duplicates:
    radius-meters: ${DUPLICATE_RADIUS_METERS:100}
    ignored-tokens: [building, bldg, tower, bhaban, bhabon, house, road, rd, lane, the]
