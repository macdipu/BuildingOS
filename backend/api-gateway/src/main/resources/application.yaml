server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
platform:
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    jwk-set-uri: ${JWT_JWK_SET_URI}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    public-paths:
      - /api/v1/auth/otp/start
      - /api/v1/auth/otp/verify
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
logging:
  structured:
    # STORY-004: one JSON object per line; redaction is applied by platform-web (spring.factories customizer).
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
      rename:
        logger_name: logger
spring:
  application:
    name: api-gateway
---
# Plain-text console logs under the test profile keep test output readable.
spring:
  config:
    activate:
      on-profile: test
logging:
  structured:
    format:
      console: ""
