name: platform

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn verify (compile, unit, security/integration tests)
        run: mvn -B -f backend/pom.xml verify

  contracts:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check-contracts.py

  infra:
    name: Compose + platform verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local-only compose env
        run: cp infra/docker/.env.example infra/docker/.env
      - run: docker compose -f infra/docker/compose.yaml config --quiet
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: scripts/verify-platform.sh (Postgres/Kafka isolation, smoke, restart)
        run: sh scripts/verify-platform.sh

  container-builds:
    name: Container image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f backend/pom.xml package -DskipTests
      - run: docker build --tag buildingos/identity-service:ci backend/identity-service
      - run: docker build --tag buildingos/building-service:ci backend/building-service
      - run: docker build --tag buildingos/api-gateway:ci backend/api-gateway

  flutter-baseline:
    name: Flutter baseline (user_app)
    runs-on: ubuntu-latest
    # BOS-001 is backend-only; user_app has pre-existing, unrelated analyze/test failures
    # recorded in agentic/data/project-context/features/BOS-001/BASELINE.md. This job
    # reports the baseline without blocking backend platform CI on unrelated template debt.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: kuhnroyal/flutter-fvm-config-action@v3
        id: fvm-config
        with:
          path: user_app/.fvmrc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config.outputs.FLUTTER_VERSION }}
      - run: sh scripts/verify-flutter.sh
