<script>
    // Subtle organic progress label update simulation
    document.addEventListener('DOMContentLoaded', () => {
      const messages = [
        "Initializing building context & authentication...",
        "Validating multi-tenant permissions...",
        "Reconciling utility meters & BDT ledgers...",
        "System ready. Connecting to unit gateway..."
      ];
      let index = 0;
      const label = document.querySelector('.animate-progress-fill')?.parentElement?.nextElementSibling?.querySelector('span.font-body-sm');
      
      if (label) {
        setInterval(() => {
          index = (index + 1) % messages.length;
          label.style.opacity = '0';
          setTimeout(() => {
            label.textContent = messages[index];
            label.style.opacity = '1';
          }, 200);
        }, 3200);
      }
    });
  </script>
